<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1200" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
        </marker>
    </defs>

    <!-- Título -->
    <text x="540" y="30" font-size="16" font-weight="bold" fill="#343a40" text-anchor="middle">T-04 — Trámites en Línea y RETYS</text>

    <!-- ================= CARRILES (SWIMLANES) ================= -->
    <rect x="40" y="50" width="220" height="1120" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="150" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R1</text>
    <text x="150" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Ciudadanía (Solicitante)</text>

    <rect x="260" y="50" width="220" height="1120" fill="#ffffff" stroke="#e9ecef" />
    <text x="370" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R3</text>
    <text x="370" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Plataforma RETYS</text>

    <rect x="480" y="50" width="220" height="1120" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="590" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R4</text>
    <text x="590" y="90" font-size="12" fill="#6c757d" text-anchor="middle">DRF (Ventanilla Física)</text>

    <rect x="700" y="50" width="220" height="1120" fill="#ffffff" stroke="#e9ecef" />
    <text x="810" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R2</text>
    <text x="810" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Comité Mejora Regulatoria</text>

    <!-- ================= AGRUPADORES LATERALES ================= -->
    <rect x="10" y="100" width="20" height="250" rx="10" fill="#e8f0fe" />
    <text x="-225" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">A. Mejora Regulatoria</text>
    
    <rect x="10" y="370" width="20" height="340" rx="10" fill="#fff3cd" />
    <text x="-540" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">B. Interacción Digital (Online)</text>
    
    <rect x="10" y="730" width="20" height="420" rx="10" fill="#d4edda" />
    <text x="-940" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">C. Ejecución y Servicio</text>

    <!-- ================= CONEXIONES ================= -->
    <g fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)">
        <!-- Fase A -->
        <path d="M 810 105 L 810 130" />
        <path d="M 810 190 L 810 220" />
        <path d="M 810 280 L 810 295 L 370 295 L 370 310" />
        
        <!-- Fase B -->
        <path d="M 150 380 L 150 400" />
        <path d="M 150 460 L 150 475 L 370 475 L 370 490" />
        <path d="M 370 550 L 370 565 L 150 565 L 150 580" />
        <path d="M 150 640 L 150 670" />
        
        <!-- Fase C -->
        <path d="M 150 730 L 150 745 L 590 745 L 590 760" />
        <path d="M 590 820 L 590 850" />
        <path d="M 590 910 L 590 925 L 150 925 L 150 940" />
        <path d="M 150 1000 L 150 1015 L 370 1015 L 370 1030" />
        <path d="M 370 1090 L 370 1120" />
    </g>

    <!-- ================= NODOS ================= -->
    <style>
        .node { fill: #eaf2ff; stroke: #a0c4ff; stroke-width: 1.5; rx: 6; }
        .node-text { font-size: 11px; fill: #495057; text-anchor: middle; }
    </style>

    <circle cx="810" cy="95" r="5" fill="#343a40" />
    <circle cx="150" cy="370" r="5" fill="#343a40" />

    <!-- A1 -->
    <rect x="720" y="130" width="180" height="60" class="node" />
    <text x="810" y="155" class="node-text">
        <tspan x="810" dy="0">T4·A1 - Proponer mejoras a</tspan>
        <tspan x="810" dy="15">Trámites y Reglas (RO)</tspan>
    </text>

    <!-- A2 -->
    <rect x="720" y="220" width="180" height="60" class="node" />
    <text x="810" y="245" class="node-text">
        <tspan x="810" dy="0">T4·A2 - CEMER dictamina y</tspan>
        <tspan x="810" dy="15">aprueba Programa (PMR)</tspan>
    </text>

    <!-- A3 -->
    <rect x="280" y="310" width="180" height="60" class="node" />
    <text x="370" y="335" class="node-text">
        <tspan x="370" dy="0">T4·A3 - Actualiza Catálogo</tspan>
        <tspan x="370" dy="15">Público (18 trámites)</tspan>
    </text>

    <!-- B1 -->
    <rect x="60" y="400" width="180" height="60" class="node" />
    <text x="150" y="425" class="node-text">
        <tspan x="150" dy="0">T4·B1 - Accede al Portal</tspan>
        <tspan x="150" dy="15">Web de PROBOSQUE</tspan>
    </text>

    <!-- B2 -->
    <rect x="280" y="490" width="180" height="60" class="node" />
    <text x="370" y="515" class="node-text">
        <tspan x="370" dy="0">T4·B2 - Muestra Cédula</tspan>
        <tspan x="370" dy="15">(Costos, Tiempos, Sede)</tspan>
    </text>

    <!-- B3 -->
    <rect x="60" y="580" width="180" height="60" class="node" />
    <text x="150" y="605" class="node-text">
        <tspan x="150" dy="0">T4·B3 - Descarga formato</tspan>
        <tspan x="150" dy="15">oficial PDF (Ej. FO-PB-501A)</tspan>
    </text>

    <!-- C1 -->
    <rect x="60" y="670" width="180" height="60" class="node" />
    <text x="150" y="695" class="node-text">
        <tspan x="150" dy="0">T4·C1 - Llena formato y</tspan>
        <tspan x="150" dy="15">acude físicamente a DRF</tspan>
    </text>

    <!-- C2.1 -->
    <rect x="500" y="760" width="180" height="60" class="node" />
    <text x="590" y="785" class="node-text">
        <tspan x="590" dy="0">T4·C2 - Recibe docs. según</tspan>
        <tspan x="590" dy="15">Cédula Oficial RETYS</tspan>
    </text>

    <!-- C2.2 -->
    <rect x="500" y="850" width="180" height="60" class="node" />
    <text x="590" y="875" class="node-text">
        <tspan x="590" dy="0">Activa reloj de respuesta</tspan>
        <tspan x="590" dy="15">máxima y emite Resolución</tspan>
    </text>

    <!-- C3.1 -->
    <rect x="60" y="940" width="180" height="60" class="node" />
    <text x="150" y="965" class="node-text">
        <tspan x="150" dy="0">T4·C3 - Recibe respuesta</tspan>
        <tspan x="150" dy="15">institucional al trámite</tspan>
    </text>

    <!-- C3.2 -->
    <rect x="280" y="1030" width="180" height="60" class="node" />
    <text x="370" y="1055" class="node-text">
        <tspan x="370" dy="0">Evalúa calidad del servicio</tspan>
        <tspan x="370" dy="15">(Encuesta Satisfacción web)</tspan>
    </text>

    <!-- Fin -->
    <circle cx="370" cy="1130" r="5" fill="#ffffff" stroke="#343a40" stroke-width="2" />
    <circle cx="370" cy="1130" r="2" fill="#343a40" />

</svg>
