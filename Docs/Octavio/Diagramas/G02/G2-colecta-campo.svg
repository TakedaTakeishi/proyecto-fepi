<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 950" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
        </marker>
    </defs>

    <!-- Título -->
    <text x="540" y="30" font-size="16" font-weight="bold" fill="#343a40" text-anchor="middle">G2 — Colecta en campo</text>

    <!-- Carriles (Swimlanes) -->
    <!-- R1 -->
    <rect x="40" y="50" width="220" height="870" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="150" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R1</text>
    <text x="150" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Propietario Predio</text>
    <!-- R2 -->
    <rect x="260" y="50" width="220" height="870" fill="#ffffff" stroke="#e9ecef" />
    <text x="370" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R2</text>
    <text x="370" y="90" font-size="12" fill="#6c757d" text-anchor="middle">SEMARNAT</text>
    <!-- R3 -->
    <rect x="480" y="50" width="220" height="870" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="590" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R3</text>
    <text x="590" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Brigada Colecta</text>
    <!-- R4 -->
    <rect x="700" y="50" width="220" height="870" fill="#ffffff" stroke="#e9ecef" />
    <text x="810" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R4</text>
    <text x="810" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Banco de Germoplasma</text>

    <!-- Barra lateral izquierda (Agrupador) -->
    <rect x="10" y="100" width="20" height="340" rx="10" fill="#e8f0fe" />
    <text x="-270" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">Gestión Regulatoria</text>
    
    <rect x="10" y="460" width="20" height="420" rx="10" fill="#fff3cd" />
    <text x="-670" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">Extracción Física</text>

    <!-- ================= CONEXIONES (FLECHAS) ================= -->
    <g fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)">
        <!-- Secuencia -->
        <path d="M 590 105 L 590 130" />
        <path d="M 590 190 L 590 205 L 150 205 L 150 220" />
        <path d="M 150 280 L 150 295 L 590 295 L 590 310" />
        <path d="M 590 370 L 590 385 L 370 385 L 370 400" />
        <path d="M 370 460 L 370 475 L 590 475 L 590 490" />
        <path d="M 590 550 L 590 580" />
        <path d="M 590 640 L 590 670" />
        <path d="M 590 730 L 590 745 L 810 745 L 810 760" />
        <path d="M 810 820 L 810 855" />
    </g>

    <!-- ================= NODOS ================= -->
    <style>
        .node { fill: #eaf2ff; stroke: #a0c4ff; stroke-width: 1.5; rx: 6; }
        .node-text { font-size: 11px; fill: #495057; text-anchor: middle; }
    </style>

    <!-- Puntos de inicio -->
    <circle cx="590" cy="100" r="5" fill="#343a40" />

    <!-- G2.1 -->
    <rect x="500" y="130" width="180" height="60" class="node" />
    <text x="590" y="155" class="node-text">
        <tspan x="590" dy="0">G2.1 - Identifica predios</tspan>
        <tspan x="590" dy="15">y contacta a dueños</tspan>
    </text>

    <!-- G2.2 -->
    <rect x="60" y="220" width="180" height="60" class="node" />
    <text x="150" y="245" class="node-text">
        <tspan x="150" dy="0">G2.2 - Otorga</tspan>
        <tspan x="150" dy="15">consentimiento/Asamblea</tspan>
    </text>

    <!-- G2.3 -->
    <rect x="500" y="310" width="180" height="60" class="node" />
    <text x="590" y="335" class="node-text">
        <tspan x="590" dy="0">G2.3 - Presenta Aviso</tspan>
        <tspan x="590" dy="15">de Colecta</tspan>
    </text>

    <!-- G2.4 -->
    <rect x="280" y="400" width="180" height="60" class="node" />
    <text x="370" y="425" class="node-text">
        <tspan x="370" dy="0">G2.4 - Emite constancia</tspan>
        <tspan x="370" dy="15">(vigencia 2 años)</tspan>
    </text>

    <!-- G2.5 -->
    <rect x="500" y="490" width="180" height="60" class="node" />
    <text x="590" y="515" class="node-text">
        <tspan x="590" dy="0">G2.5 - Recolecta frutos</tspan>
        <tspan x="590" dy="15">en campo</tspan>
    </text>

    <!-- G2.6 -->
    <rect x="500" y="580" width="180" height="60" class="node" />
    <text x="590" y="605" class="node-text">
        <tspan x="590" dy="0">G2.6 - Etiqueta frutos</tspan>
        <tspan x="590" dy="15">(procedencia/especie/fecha)</tspan>
    </text>

    <!-- G2.7 -->
    <rect x="500" y="670" width="180" height="60" class="node" />
    <text x="590" y="695" class="node-text">
        <tspan x="590" dy="0">G2.7 - Transporta fruto</tspan>
        <tspan x="590" dy="15">a instalaciones</tspan>
    </text>

    <!-- G2.8 -->
    <rect x="720" y="760" width="180" height="60" class="node" />
    <text x="810" y="785" class="node-text">
        <tspan x="810" dy="0">G2.8 - Recibe y pesa fruto</tspan>
        <tspan x="810" dy="15">para ingreso a Banco</tspan>
    </text>

    <!-- Puntos de fin -->
    <circle cx="810" cy="860" r="5" fill="#ffffff" stroke="#343a40" stroke-width="2" />
    <circle cx="810" cy="860" r="2" fill="#343a40" />

</svg>
