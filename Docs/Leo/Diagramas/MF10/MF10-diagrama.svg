<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1350" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
        </marker>
    </defs>

    <!-- Título -->
    <text x="800" y="30" font-size="16" font-weight="bold" fill="#343a40" text-anchor="middle">MF-10 — Sanidad Forestal (Flujo Administrativo)</text>

    <!-- ================= CARRILES (SWIMLANES) ================= -->
    <rect x="40" y="50" width="220" height="1260" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="150" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R1 / R40</text>
    <text x="150" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Propietario / PST</text>

    <rect x="260" y="50" width="260" height="1260" fill="#ffffff" stroke="#e9ecef" />
    <text x="390" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R29</text>
    <text x="390" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Delegación Regional (DRF)</text>

    <rect x="520" y="50" width="260" height="1260" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="650" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R42</text>
    <text x="650" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Dir. General / Prot. Forestal (DPF)</text>

    <rect x="780" y="50" width="300" height="1260" fill="#ffffff" stroke="#e9ecef" />
    <text x="930" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R41</text>
    <text x="930" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Depto. Sanidad Forestal (DSF)</text>

    <rect x="1080" y="50" width="260" height="1260" fill="#f8f9fa" stroke="#e9ecef" />
    <text x="1210" y="75" font-size="12" font-weight="bold" fill="#6c757d" text-anchor="middle">R20</text>
    <text x="1210" y="90" font-size="12" fill="#6c757d" text-anchor="middle">Unidad Jurídica</text>

    <!-- ================= AGRUPADORES LATERALES ================= -->
    <rect x="10" y="100" width="20" height="420" rx="10" fill="#e8f0fe" />
    <text x="-310" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">A. Aviso y Verificación</text>
    
    <rect x="10" y="540" width="20" height="430" rx="10" fill="#fff3cd" />
    <text x="-755" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">B. Trámite Jurídico y Autorización</text>
    
    <rect x="10" y="990" width="20" height="260" rx="10" fill="#d4edda" />
    <text x="-1120" y="24" transform="rotate(-90)" font-size="11" fill="#495057" text-anchor="middle">C. Notificación y Ejecución</text>

    <!-- ================= CONEXIONES ================= -->
    <g fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrow)">
        <!-- Fase A -->
        <path d="M 150 100 L 150 125" />
        <path d="M 150 185 L 150 200 L 650 200 L 650 215" />
        <path d="M 650 275 L 650 290 L 930 290 L 930 305" />
        <path d="M 930 365 L 930 380 L 390 380 L 390 395" />
        <path d="M 390 455 L 390 565" />
        
        <!-- Fase B -->
        <path d="M 390 625 L 390 640 L 650 640 L 650 655" />
        
        <!-- Rombo -->
        <path d="M 650 715 L 650 745" />
        <!-- No -->
        <path d="M 610 775 L 390 775 L 390 625" marker-end="url(#arrow)" />
        <!-- Sí -->
        <path d="M 690 775 L 930 775 L 930 805" />
        
        <path d="M 930 865 L 930 880 L 1210 880 L 1210 895" />
        <path d="M 1210 955 L 1210 1015 L 650 1015 L 650 1030" />

        <!-- Fase C -->
        <path d="M 650 1090 L 650 1105 L 930 1105 L 930 1120" />
        <path d="M 930 1180 L 930 1195 L 150 1195 L 150 1210" />

        <!-- End -->
        <path d="M 150 1270 L 150 1290" />
    </g>

    <!-- Textos de Rombos -->
    <text x="500" y="765" font-size="11" fill="#dc3545">No</text>
    <text x="750" y="765" font-size="11" fill="#28a745">Sí</text>

    <!-- ================= NODOS ================= -->
    <style>
        .node { fill: #eaf2ff; stroke: #a0c4ff; stroke-width: 1.5; rx: 6; }
        .node-text { font-size: 11px; fill: #495057; text-anchor: middle; }
    </style>

    <circle cx="150" cy="95" r="5" fill="#343a40" />

    <!-- A1 y A2 -->
    <rect x="60" y="125" width="180" height="60" class="node" />
    <text x="150" y="150" class="node-text">
        <tspan x="150" dy="0">MF10·A1/A2 - Emite Aviso e</tspan>
        <tspan x="150" dy="15">Ingresa Informe Técnico (ITF)</tspan>
    </text>

    <!-- A3 -->
    <rect x="560" y="215" width="180" height="60" class="node" />
    <text x="650" y="240" class="node-text">
        <tspan x="650" dy="0">MF10·A3 - DG recibe</tspan>
        <tspan x="650" dy="15">y turna a Protección (DPF)</tspan>
    </text>

    <!-- A4 -->
    <rect x="840" y="305" width="180" height="60" class="node" />
    <text x="930" y="330" class="node-text">
        <tspan x="930" dy="0">MF10·A4 - Genera bitácora</tspan>
        <tspan x="930" dy="15">SINAT y turna a la DRF</tspan>
    </text>

    <!-- A5 -->
    <rect x="300" y="395" width="180" height="60" class="node" />
    <text x="390" y="420" class="node-text">
        <tspan x="390" dy="0">MF10·A5 - Visita campo,</tspan>
        <tspan x="390" dy="15">valida fases y levanta minuta</tspan>
    </text>

    <!-- B1 -->
    <rect x="300" y="565" width="180" height="60" class="node" />
    <text x="390" y="590" class="node-text">
        <tspan x="390" dy="0">MF10·B1 - Delegado firma</tspan>
        <tspan x="390" dy="15">Dictamen Regional y envía</tspan>
    </text>

    <!-- B2 -->
    <rect x="560" y="655" width="180" height="60" class="node" />
    <text x="650" y="680" class="node-text">
        <tspan x="650" dy="0">MF10·B2 - DPF revisa</tspan>
        <tspan x="650" dy="15">dictamen emitido</tspan>
    </text>

    <!-- Rombo B2 -->
    <polygon points="650,745 690,775 650,805 610,775" fill="#fff9db" stroke="#ffd43b" stroke-width="1.5" />
    <text x="650" y="780" class="node-text">¿Es correcto?</text>

    <!-- B3 -->
    <rect x="840" y="805" width="180" height="60" class="node" />
    <text x="930" y="830" class="node-text">
        <tspan x="930" dy="0">MF10·B3 - Elabora, rubrica</tspan>
        <tspan x="930" dy="15">y envía Notificación</tspan>
    </text>

    <!-- B4 -->
    <rect x="1120" y="895" width="180" height="60" class="node" />
    <text x="1210" y="920" class="node-text">
        <tspan x="1210" dy="0">MF10·B4 - Revisa,</tspan>
        <tspan x="1210" dy="15">rubrica y turna a la DG</tspan>
    </text>

    <!-- B5 -->
    <rect x="560" y="1030" width="180" height="60" class="node" />
    <text x="650" y="1055" class="node-text">
        <tspan x="650" dy="0">MF10·B5 - DG recibe y</tspan>
        <tspan x="650" dy="15">firma Notificación (Resolución)</tspan>
    </text>

    <!-- C1 -->
    <rect x="840" y="1120" width="180" height="60" class="node" />
    <text x="930" y="1145" class="node-text">
        <tspan x="930" dy="0">MF10·C1 - Recibe notif.</tspan>
        <tspan x="930" dy="15">firmada y la entrega a R1</tspan>
    </text>

    <!-- C2 -->
    <rect x="60" y="1210" width="180" height="60" class="node" />
    <text x="150" y="1235" class="node-text">
        <tspan x="150" dy="0">MF10·C2 - Recibe oficial,</tspan>
        <tspan x="150" dy="15">ejecuta Derribo y Saneamiento</tspan>
    </text>

    <!-- Puntos de fin -->
    <circle cx="150" cy="1300" r="5" fill="#ffffff" stroke="#343a40" stroke-width="2" />
    <circle cx="150" cy="1300" r="2" fill="#343a40" />

</svg>
